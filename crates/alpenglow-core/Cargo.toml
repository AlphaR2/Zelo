[package]
name = "alpenglow-core"
description = "The verifier: Alpenglow finality, shreds and block_id, transactions and block state, in plain Rust so it runs inside the SP1 zkVM."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true

[dependencies]
# `experimental` = hash_to_curve; in SP1's patched crate it takes a sha2 0.10 hasher.
bls12_381 = { workspace = true, features = ["groups", "pairings", "alloc", "experimental"] }
sha2.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
# `fixture`: read inputs from JSON fixtures (host only). On by default for tests and tools;
# the SP1 program turns it off.
default = ["fixture"]
fixture = ["dep:serde_json", "dep:hex"]

[dev-dependencies]
serde_json.workspace = true
hex.workspace = true
