[package]
name = "footer-dump"
description = "Geyser plugin: writes each Alpenglow block footer's raw certificates to a JSON-lines file."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Own workspace: the validator loads this library into its own process, so it must be built
# with the validator's exact Rust (rust-toolchain.toml) and the exact crates it shares.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The versions in Agave 4.4.x's Cargo.toml. These types cross into the validator.
agave-geyser-plugin-interface = "=5.0.0"
solana-bls-signatures = "=4.0.0"
solana-clock = "=4.0.0"
solana-hash = "=4.6.0"
hex = "0.4"
serde_json = "1"
