[package]
name = "zelo-fill"
description = "Pays a merchant on Solana and leaves a provable message for the escrow on another chain."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
zelo-programs.workspace = true
pinocchio.workspace = true
pinocchio-token.workspace = true
# `decode`: the outbox id is read from base58 at compile time (`ZELO_OUTBOX_ID`).
solana-address = { workspace = true, features = ["decode"] }

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { workspace = true, features = ["decode", "curve25519"] }

[lints]
workspace = true
