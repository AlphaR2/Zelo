name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The main workspace: the verifier, the Agave reference and the data tools.
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev protobuf-compiler
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace

  # The Solana programs: built for SBF, then run in Agave's runtime (Mollusk).
  programs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs
    env:
      # Any id works for the tests: 32 bytes of 0x0b.
      HUGINN_OUTBOX_ID: k7FaK87WHGVXzkaoHb7CdVPgkKDQhZ29VLDeBVbDfYn
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - name: Install the Solana CLI (Agave 4.4.1)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.4.1/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build-sbf
      - run: cargo test

  # The prover: builds the SP1 program in SP1's pinned Docker image, then runs the prover's tests.
  prover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zk/prover
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zk/prover
      - run: cargo fmt --check && (cd ../program && cargo fmt --check)
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  # The Geyser plugin, with the validator's own Rust (plugins/footer-dump/rust-toolchain.toml).
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/footer-dump
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/footer-dump
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # Security advisories, licences and dependency sources (deny.toml), for every lockfile.
  deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manifest: [Cargo.toml, zk/prover/Cargo.toml, zk/program/Cargo.toml, programs/Cargo.toml, plugins/footer-dump/Cargo.toml]
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check
          command-arguments: --config deny.toml advisories licenses sources

  # Every relative link in the Markdown files points at a file that exists.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        shell: python
        run: |
          import os, re, sys
          broken = []
          for root, _, files in os.walk("."):
              if "/target" in root or "/.git" in root:
                  continue
              for name in files:
                  if not name.endswith(".md"):
                      continue
                  path = os.path.join(root, name)
                  for link in re.findall(r"\]\(([^)#\s]+)", open(path).read()):
                      if "://" in link or link.startswith("mailto:"):
                          continue
                      if not os.path.exists(os.path.normpath(os.path.join(root, link))):
                          broken.append(f"{path}: {link}")
          print("\n".join(broken) or "all links resolve")
          sys.exit(1 if broken else 0)
